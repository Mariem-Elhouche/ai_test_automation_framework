services:
  test-executor:
    build:
      context: ..
      dockerfile: dashboard-api/Dockerfile.executor
    container_name: ai_test_executor
    environment:
      MAVEN_PROJECT_DIR: /app/automation-framework
      BACKOFFICE_URL: https://stg-bo.noveocare.com/login
      BACKOFFICE_USER_EMAIL: ${BACKOFFICE_USER_EMAIL}
      BACKOFFICE_USER_PASSWORD: ${BACKOFFICE_USER_PASSWORD}
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY}
    volumes:
      - ../automation-framework:/app/automation-framework
      - m2_cache:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock:ro
    profiles:
      - executor
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ai_dashboard_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  dashboard-api:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: ai_dashboard_api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY}
      DASHBOARD_JWT_SECRET: ${DASHBOARD_JWT_SECRET}
      DASHBOARD_JWT_EXPIRE_MINUTES: ${DASHBOARD_JWT_EXPIRE_MINUTES}
      DASHBOARD_ADMIN_EMAIL: ${DASHBOARD_ADMIN_EMAIL}
      DASHBOARD_ADMIN_PASSWORD: ${DASHBOARD_ADMIN_PASSWORD}
      DASHBOARD_ADMIN_DISPLAY_NAME: ${DASHBOARD_ADMIN_DISPLAY_NAME}
      DASHBOARD_PM_EMAIL: ${DASHBOARD_PM_EMAIL}
      DASHBOARD_PM_PASSWORD: ${DASHBOARD_PM_PASSWORD}
      DASHBOARD_PM_PASSWORD_HASH: ${DASHBOARD_PM_PASSWORD_HASH}
      DASHBOARD_PM_DISPLAY_NAME: ${DASHBOARD_PM_DISPLAY_NAME}
      DASHBOARD_QA_EMAIL: ${DASHBOARD_QA_EMAIL}
      DASHBOARD_QA_PASSWORD: ${DASHBOARD_QA_PASSWORD}
      DASHBOARD_QA_PASSWORD_HASH: ${DASHBOARD_QA_PASSWORD_HASH}
      DASHBOARD_QA_DISPLAY_NAME: ${DASHBOARD_QA_DISPLAY_NAME}
      SELF_HEALING_METRICS_URL: ${SELF_HEALING_METRICS_URL}
      SELF_HEALING_METRICS_TIMEOUT_SECONDS: ${SELF_HEALING_METRICS_TIMEOUT_SECONDS}
      MAVEN_PROJECT_DIR: /app/automation-framework
      MAVEN_CMD: mvn
      BACKOFFICE_URL: https://stg-bo.noveocare.com/login
      BACKOFFICE_USER_EMAIL: ${BACKOFFICE_USER_EMAIL}
      BACKOFFICE_USER_PASSWORD: ${BACKOFFICE_USER_PASSWORD}
      SELF_HEALING_ENABLED: "true"
      RERUN_ENABLED: ${RERUN_ENABLED}
      DASHBOARD_API_KEY_FOR_TESTS: ${DASHBOARD_API_KEY_FOR_TESTS}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env
      - ./src:/app/src
      - ../automation-framework/target/reports:/app/reports
      - ../automation-framework:/app/automation-framework
      - ../pom.xml:/app/pom.xml
      - m2_cache:/root/.m2
  dashboard-ui:
    build:
      context: ../dashboard-ui
      dockerfile: Dockerfile
    container_name: ai_dashboard_ui
    ports:
      - "5173:80"
    depends_on:
      dashboard-api:
        condition: service_started
volumes:
  pgdata:
  m2_cache:






