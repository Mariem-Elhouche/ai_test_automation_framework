# Driver lifecycle
# false = new browser per scenario
# true  = reuse the same browser across scenarios (all tags)
driver.reuse.enabled=false

# When driver.reuse.enabled=true:
# full = reset cookies + storage + about:blank between scenarios (safer isolation)
# none = keep browser state between scenarios (faster but less isolated)
driver.reuse.reset.strategy=full

