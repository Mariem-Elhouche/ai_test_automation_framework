name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'automation-framework/**'
      - '.github/workflows/**'
      - 'pom.xml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'automation-framework/**'
      - '.github/workflows/**'
      - 'pom.xml'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tags to run (e.g. @login or @regression)'
        required: false
        default: '@login'

env:
  MAVEN_CLI_OPTS: '-pl automation-framework -P ci --no-transfer-progress'

jobs:
  build:
    name: Build & Compile
    runs-on: [self-hosted, linux]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}

      - name: Compile
        run: mvn compile -q ${{ env.MAVEN_CLI_OPTS }}

      - name: Test-compile
        run: mvn test-compile -q ${{ env.MAVEN_CLI_OPTS }}

  login-tests:
    name: Login Tests
    needs: [build]
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}

      - name: Health check — site accessible ?
        id: health
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 \
            https://stg-bo.noveocare.com/login)
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" = "403" ] || [ "$HTTP_CODE" = "502" ] || [ "$HTTP_CODE" = "503" ]; then
            echo "Site indisponible ($HTTP_CODE) — tests ignorés"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run login tests
        if: steps.health.outputs.skip != 'true'
        run: |
          TAGS="${{ github.event.inputs.tags || '@login' }}"
          xvfb-run --auto-servernum \
            mvn test ${{ env.MAVEN_CLI_OPTS }} \
              -Dtest=LoginTestRunner \
              -Dcucumber.filter.tags="$TAGS" \
              -Dbackoffice.url=https://stg-bo.noveocare.com/login \
              -Dbackoffice.user.email=${{ secrets.BACKOFFICE_USER_EMAIL }} \
              -Dbackoffice.user.password=${{ secrets.BACKOFFICE_USER_PASSWORD }} \
              -Dself.healing.enabled=true \
              -Ddashboard.api.url=http://127.0.0.1:8080

      - name: Skipped — maintenance
        if: steps.health.outputs.skip == 'true'
        run: echo "::warning::Tests ignorés — site staging indisponible"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-login
          path: |
            automation-framework/target/reports/login/
            automation-framework/target/cucumber-login.json
          if-no-files-found: warn

      - name: Upload healing debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healing-debug-login
          path: automation-framework/target/healing-debug/
          if-no-files-found: ignore
